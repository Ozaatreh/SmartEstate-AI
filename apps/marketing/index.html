<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F3EEE6" />
    <script>
      // Apply the saved (or system) theme before the first paint, so the page never flashes the wrong theme.
      (function () {
        var theme;
        try { theme = localStorage.getItem("smartestate-theme"); } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#191B1E" : "#F3EEE6");
        // Language: ?lang= in the URL, else the saved choice, else English. Arabic is right-to-left.
        var lang = new URLSearchParams(window.location.search).get("lang");
        if (lang !== "ar" && lang !== "en") { try { lang = localStorage.getItem("smartestate-lang"); } catch (e) {} }
        if (lang === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      })();
    </script>
    <meta name="description" content="SmartEstate — residential projects in Saudi Arabia. Browse available units and payment plans, explore projects in 3D and book a viewing." />
    <title>SmartEstate — Find your new home</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
