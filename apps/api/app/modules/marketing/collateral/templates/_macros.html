{# Neutral placeholder art (no photo, no text): tonal blocks suggesting architecture. Replaced by an approved image when one exists. #}
{% macro placeholder(id) %}
<svg class="ph" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="{{ id }}-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9df"/><stop offset="1" stop-color="#e2d8c9"/>
    </linearGradient>
    <linearGradient id="{{ id }}-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a37f" stop-opacity=".55"/><stop offset="1" stop-color="#d9a37f" stop-opacity="0"/>
    </linearGradient>
    <pattern id="{{ id }}-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#{{ id }}-sky)"/>
  <circle cx="930" cy="230" r="260" fill="url(#{{ id }}-sun)"/>
  <rect x="120" y="300" width="250" height="500" fill="#cdbfae"/>
  <rect x="120" y="300" width="250" height="500" fill="url(#{{ id }}-grid)"/>
  <rect x="330" y="180" width="300" height="620" fill="#b9a893"/>
  <rect x="330" y="180" width="300" height="620" fill="url(#{{ id }}-grid)"/>
  <rect x="600" y="340" width="230" height="460" fill="#a99781"/>
  <rect x="600" y="340" width="230" height="460" fill="url(#{{ id }}-grid)"/>
  <rect x="800" y="260" width="280" height="540" fill="#c4b39f"/>
  <rect x="800" y="260" width="280" height="540" fill="url(#{{ id }}-grid)"/>
</svg>
{% endmacro %}

{% macro mark(size=28) %}
<svg class="mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
  <rect width="32" height="32" rx="7" fill="#a4532b"/>
  <path d="M8 14.5 16 8l8 6.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 17.5h10.5a3.5 3.5 0 0 1 0 7H8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
</svg>
{% endmacro %}

{% macro wordmark(light=false) %}
<span class="wordmark{{ ' light' if light }}">{{ mark() }}<span dir="ltr">SmartEstate <em>AI</em></span></span>
{% endmacro %}
