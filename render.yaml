# SmartEstate AI — Render Blueprint for the API (https://render.com/docs/blueprint-spec). Free plan only.
# Nothing is created until the owner applies it from their own Render account.
#
# $0 architecture (docs/DEPLOYMENT.md):
#   Cloudflare Pages (free)  website + dashboard, each proxying /api to this service through a Pages Function
#   Render (free)            this Docker service: FastAPI + automation worker (+ migrations and seed on start)
#   Neon (free)              PostgreSQL (also the automation job queue)
#   Cloudflare Worker (free, optional) daytime keep-alive ping

services:
  - type: web
    name: smartestate-api
    runtime: docker
    plan: free
    region: ohio # same AWS region as the Neon database (US East 2)
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: staging
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL # postgresql+psycopg://USER:PASSWORD@HOST/DB?sslmode=require (Neon, pooled host)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS # browsers reach the API through the Pages proxies (same origin); listed for direct calls
        value: https://smartestate-website.pages.dev,https://smartestate-dashboard.pages.dev
      # Hosted evaluation demo: fictional accounts and data, seeded once on first boot (refused in production).
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@smartestate.demo
      - key: SEED_DEMO_PASSWORD # ≥ 12 characters; shared privately with evaluators, never committed
        sync: false
      # AI stays off unless the owner adds a key; no paid usage is generated by default.
      - key: AI_ENABLED
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DEFAULT_MODEL
        value: claude-haiku-5-5
      - key: AI_DAILY_COST_CAP_USD
        value: "1"
      - key: AI_MARKETING_STUDIO_ENABLED
        value: "false"
